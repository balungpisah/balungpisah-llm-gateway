# ┌────────────────────────────────────────────────────────────────────────────┐
# │                             FUNCTION CONFIGS                              │
# └────────────────────────────────────────────────────────────────────────────┘

# General chat function - default for agent conversations
[functions.chat]
type = "chat"

[functions.chat.variants.baseline]
type = "chat_completion"
model = "gpt-4o-mini"
max_tokens = 4096

# ┌────────────────────────────────────────────────────────────────────────────┐
# │                                METRICS                                     │
# └────────────────────────────────────────────────────────────────────────────┘

[metrics.conversation_quality]
level = "inference"
optimize = "max"
type = "float"

[metrics.response_time]
level = "inference"
optimize = "min"
type = "float"
