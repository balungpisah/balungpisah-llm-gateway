# TensorZero Configuration for Development
# See: https://www.tensorzero.com/docs/gateway/configuration
#
# API keys are provided dynamically by consumers via `api_key_location = "dynamic::system_api_key"`
# This allows ADK users to use their own API keys at request time.

# ┌────────────────────────────────────────────────────────────────────────────┐
# │                              MODEL CONFIGS                                 │
# └────────────────────────────────────────────────────────────────────────────┘

# OpenAI Models
[models."gpt-4o"]
routing = ["openai"]
[models."gpt-4o".providers.openai]
type = "openai"
model_name = "gpt-4o"
api_key_location = "dynamic::system_api_key"

